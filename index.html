<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Гра — Ловля монет</title>
</head>
<body>

<script>
  // ============================================================
  // НАДНАДІЙНИЙ ПЕРЕХОПЛЮВАЧ ПОМИЛОК (ХОВАЄ ВСІ ВІКНА ПОМИЛОК)
  // ============================================================
  window.onerror = function(message, source, lineno, colno, error) {
    console.log('Системне глушіння помилки:', message);
    return true; // WebView DroidScript ніколи не покаже Script Error вікно
  };

  // Завантажуємо оригінальний файл гри з GitHub
  fetch('https://raw.githubusercontent.com/haha1488top-source/brawl-simulator-ua/4048e8717baef1d86372e970de2108cff41906cf/index.html')
    .then(r => r.text())
    .then(html => {
      html = html.replace(/Snd\/brawzaar menu 01\.wav/g, 'Snd/brawzaarmenu01.mp3');
      html = html.replace(/MAX_TROPHIES\s*:\s*\d+/g, 'MAX_TROPHIES: 14500');
      document.write(html);
      document.close();

      // Старт модифікацій інтерфейсу
      setTimeout(() => {
        injectDynamicStyles();
        startBrawlidaysHiding();
        initSkinOfferGridInline(); 
        initPinDropOverlay(); 
        injectShopOffers(); 
        initPinsMenuSystem(); 
        
        // Фоновий цикл автофіксу
        setInterval(() => {
          runAutoFixLogic();
          injectAutoFixButtonOnly(); 
        }, 1500);
      }, 1000);
    });

  // ============================================================
  // РОЗУМНИЙ ГЛИБОКИЙ СКАНЕР ТА СПИСУВАННЯ КРИСТАЛІВ
  // ============================================================
  function spendGems(amount) {
    let currentGems = 0;
    let foundType = null;
    let jsonKey = null;
    let jsonProp = null;

    // Крок 1: Шукаємо у глобальних змінних вікна
    if (window.gems !== undefined) { currentGems = parseInt(window.gems); foundType = 'window_gems'; }
    else if (window.player && window.player.gems !== undefined) { currentGems = parseInt(window.player.gems); foundType = 'player_gems'; }
    else if (window.crystals !== undefined) { currentGems = parseInt(window.crystals); foundType = 'window_crystals'; }
    
    // Крок 2: Шукаємо у прямих ключах localStorage
    if (!foundType) {
      if (localStorage.getItem('gems') !== null) { currentGems = parseInt(localStorage.getItem('gems')); foundType = 'local_gems'; }
      else if (localStorage.getItem('crystals') !== null) { currentGems = parseInt(localStorage.getItem('crystals')); foundType = 'local_crystals'; }
    }

    // Крок 3: Шукаємо всередині збережених JSON-об'єктів (глибокий парсинг сховища)
    if (!foundType || currentGems === 0) {
      for (let i = 0; i < localStorage.length; i++) {
        let key = localStorage.key(i);
        try {
          let data = JSON.parse(localStorage.getItem(key));
          if (data && typeof data === 'object') {
            let possibleProps = ['gems', 'gem', 'crystals', 'crystal', 'money', 'balance', 'score'];
            for (let prop of possibleProps) {
              if (data[prop] !== undefined) {
                currentGems = parseInt(data[prop]);
                foundType = 'json_local';
                jsonKey = key;
                jsonProp = prop;
                break;
              }
            }
          }
        } catch(e) {}
        if (foundType === 'json_local') break;
      }
    }

    // Крок 4: АВАРІЙНИЙ ХУК — Зчитуємо баланс прямо з тексту меню гри, якщо дані засекречені
    if (!foundType || currentGems === 0) {
      const gemSelectors = ['#gems', '#gem-count', '.gem-count', '.gems', '#player-gems', '#money', '.crystals-count', '[class*="gem"]', '[id*="gem"]'];
      for (let sel of gemSelectors) {
        let el = document.querySelector(sel);
        if (el && el.offsetWidth > 0 && el.offsetHeight > 0) {
          let textNum = parseInt(el.textContent.replace(/\D/g, '')); // Витягуємо суто цифри
          if (!isNaN(textNum) && textNum > 0) {
            currentGems = textNum;
            foundType = 'dom_fallback';
            break;
          }
        }
      }
    }

    // Перевірка, чи гравцеві вистачає коштів
    if (currentGems < amount) {
      alert(`❌ Недостатньо кристалів!\n\nПотрібно: ${amount} 💎\nУ тебе є: ${currentGems} 💎`);
      return false;
    }

    // Розрахунок нового балансу
    let newGems = currentGems - amount;
    
    // Записуємо оновлені дані туди, звідки взяли
    if (foundType === 'window_gems') window.gems = newGems;
    else if (foundType === 'player_gems') window.player.gems = newGems;
    else if (foundType === 'window_crystals') window.crystals = newGems;
    else if (foundType === 'local_gems') localStorage.setItem('gems', newGems);
    else if (foundType === 'local_crystals') localStorage.setItem('crystals', newGems);
    else if (foundType === 'json_local' && jsonKey && jsonProp) {
      try {
        let data = JSON.parse(localStorage.getItem(jsonKey));
        data[jsonProp] = newGems;
        localStorage.setItem(jsonKey, JSON.stringify(data));
      } catch(e) {}
    }

    // Про всяк випадок дублюємо в загальні змінні
    if (window.gems !== undefined) window.gems = newGems;
    if (window.player && window.player.gems !== undefined) window.player.gems = newGems;

    // Миттєво оновлюємо ВСІ цифри на екрані гри в реальному часі
    const allSelectors = ['#gems', '#gem-count', '.gem-count', '.gems', '#player-gems', '#money', '.crystals-count', '[class*="gem"]', '[id*="gem"]'];
    allSelectors.forEach(sel => {
      document.querySelectorAll(sel).forEach(el => {
        if (el.children.length === 0 || el.textContent.trim().match(/^\d+$/)) {
          el.textContent = newGems;
        } else {
          el.innerHTML = el.innerHTML.replace(/\d+/, newGems);
        }
      });
    });

    // Викликаємо системні функції збереження та оновлення оригінальної гри
    if (typeof updateUI === 'function') updateUI();
    if (typeof updateHUD === 'function') updateHUD();
    if (typeof saveGame === 'function') saveGame();
    if (typeof save === 'function') save();

    return true;
  }

  // ============================================================
  // АВТОМАТИЧНИЙ ФІКС ДУБЛІВ ТА БАНЕРІВ
  // ============================================================
  function runAutoFixLogic() {
    startBrawlidaysHiding();
    
    const shopScene = document.getElementById('shop-scene');
    if (!shopScene) return;
    
    const container = getShopContainer(shopScene);
    if (!container) return;

    const allShopElements = container.children;
    for (let i = allShopElements.length - 1; i >= 0; i--) {
      const el = allShopElements[i];
      if (el.id === 'custom-skin-offer-banner' || el.id === 'custom-pin-pack' || el.id === 'custom-skin-crow') continue;
      
      const text = el.textContent || '';
      const html = el.innerHTML || '';
      
      if (
        text.includes('Кансай') || 
        text.includes('Булл') || 
        html.includes('bull_kansai') || 
        text.includes('Мейверік') || 
        html.includes('crow_maverick')
      ) {
        el.remove();
      }
    }

    const banner = document.getElementById('custom-skin-offer-banner');
    if (!banner) {
      initSkinOfferGridInline();
    } else if (container.firstChild !== banner) {
      container.insertBefore(banner, container.firstChild);
    }
    
    if (!document.getElementById('custom-pin-pack') || !document.getElementById('custom-skin-crow')) {
      injectShopOffers();
    }
  }

  // ============================================================
  // ІНТЕГРАЦІЯ КНОПКИ ТА СТИЛІЗАЦІЯ ВНУТРІШНЬОГО UI НАЛАШТУВАНЬ
  // ============================================================
  function injectAutoFixButtonOnly() {
    const settingsScene = document.getElementById('settings-scene') || document.getElementById('settings') || document.querySelector('.settings-scene') || document.querySelector('.settings-popup');
    if (!settingsScene) return;

    const innerBox = settingsScene.querySelector('div') || settingsScene;
    if (!innerBox || innerBox === settingsScene) return;

    const allTexts = innerBox.querySelectorAll('h1, h2, h3, div, span, p');
    allTexts.forEach(el => {
      if (el.textContent.includes('Налаштування')) {
        el.style.setProperty('color', '#fff', 'important');
        el.style.setProperty('font-size', '24px', 'important');
        el.style.setProperty('font-weight', '900', 'important');
        el.style.setProperty('text-transform', 'uppercase', 'important');
        el.style.setProperty('text-shadow', '2px 2px 0px #000', 'important');
        el.style.setProperty('text-align', 'center', 'important');
      }
      if (el.textContent.includes('Музика') || el.textContent.includes('Звук')) {
        el.style.setProperty('color', '#fff', 'important');
        el.style.setProperty('font-weight', '900', 'important');
        el.style.setProperty('text-shadow', '1px 1px 1px #000', 'important');
      }
    });

    const allButtons = innerBox.querySelectorAll('button, div[onclick]');
    let backBtn = null;
    
    allButtons.forEach(b => {
      if (b.id === 'autofix-settings-btn') return;
      if (b.textContent.includes('Назад') || b.textContent.includes('Закрити')) backBtn = b;

      b.style.setProperty('border-radius', '12px', 'important');
      b.style.setProperty('font-weight', '900', 'important');
      b.style.setProperty('font-size', '13px', 'important');
      b.style.setProperty('text-transform', 'uppercase', 'important');
      b.style.setProperty('text-shadow', '1px 1px 1px #000', 'important');
      b.style.setProperty('padding', '10px', 'important');
      b.style.setProperty('border', '3px solid #222', 'important');
      
      if (b.textContent.includes('Зберегти')) {
        b.style.setProperty('background', 'linear-gradient(to bottom, #4caf50, #2e7d32)', 'important');
        b.style.setProperty('box-shadow', '0 4px 0 #1b5e20', 'important');
      } else if (b.textContent.includes('Стерти')) {
        b.style.setProperty('background', 'linear-gradient(to bottom, #f44336, #d32f2f)', 'important');
        b.style.setProperty('box-shadow', '0 4px 0 #7f1d1d', 'important');
      } else if (b.textContent.includes('Назад') || b.textContent.includes('Закрити')) {
        b.style.setProperty('background', 'linear-gradient(to bottom, #ff9800, #f57c00)', 'important');
        b.style.setProperty('box-shadow', '0 4px 0 #b35900', 'important');
      }
    });

    if (document.getElementById('autofix-settings-btn')) return;

    const fixBtn = document.createElement('button');
    fixBtn.id = 'autofix-settings-btn';
    fixBtn.innerHTML = '🔧 Автофікс гри';
    fixBtn.style.cssText = `
      width: 100% !important;
      background: linear-gradient(to bottom, #0288d1, #01579b) !important;
      color: #fff !important;
      border: 3px solid #4fc3f7 !important;
      font-weight: 900 !important;
      padding: 11px !important;
      border-radius: 12px !important;
      font-size: 13px !important;
      text-transform: uppercase !important;
      box-shadow: 0 4px 0 #002f6c !important;
      cursor: pointer !important;
      text-shadow: 1px 1px 1px #000 !important;
      margin: 2px 0 !important;
    `;

    if (backBtn) {
      backBtn.parentNode.insertBefore(fixBtn, backBtn);
    } else {
      innerBox.appendChild(fixBtn);
    }

    fixBtn.onclick = function() {
      runAutoFixLogic();
      alert('🔧 Автофікс виконано! Дублікати видалено, інтерфейс перевірено.');
    };
  }

  function startBrawlidaysHiding() {
    const shopScene = document.getElementById('shop-scene');
    if (!shopScene) return;
    const selectors = ['[class*="brawliday"]', '[id*="brawliday"]', '[class*="holiday"]', '[id*="holiday"]', '.offer-brawlidays', '#brawlidays-offer', '.seasonal-offer'];
    selectors.forEach(sel => {
      shopScene.querySelectorAll(sel).forEach(el => el.classList.add('hidden-brawlidays'));
    });
  }

  function getShopContainer(shopScene) {
    let container = shopScene.querySelector('.shop-items, .skins-grid, .items-grid, .shop-grid, .shop-content');
    if (!container) {
      const allDivs = shopScene.querySelectorAll('div');
      for (const div of allDivs) {
        if (div.children.length >= 2) { container = div; break; }
      }
    }
    return container || shopScene;
  }

  // ДОДАВАННЯ ТОВАРІВ У МАГАЗИН З ПЕРЕВІРКОЮ БАЛАНСУ
  // ============================================================

      border: 3px solid #9c27b0; border-radius: 14px; padding: 8px; cursor: pointer; min-width: 90px; min-height: 110px;

    container.insertBefore(crowCard, container.firstChild);
    container.insertBefore(pinPackCard, container.firstChild);
  }

  function confirmPurchase(skinId, skinName, price, imgUrl) {
    if (confirm(`${skinName}\n\n💰 Ціна: ${price} кристалів\n\nПридбати цей скін?`)) {
      if (spendGems(price)) {
        alert(`✅ Скін "${skinName}" успішно додано до колекції! Баланс оновлено.`);
      }
    }
  }

          </div>
        </div>
      </div>
    `;

    container.insertBefore(bannerWrapper, container.firstChild);
    const buyBtn = bannerWrapper.querySelector('#offer-buy-btn');
    if (buyBtn) {
      buyBtn.onclick = () => confirmPurchase('bull', 'Кансай Дракон Булл', 29, 'Img/bull_kansai_dragon_bull_001.png');
    }

    setInterval(() => {
      const now = new Date();
      const h = String(23 - now.getHours()).padStart(2, '0');
      const m = String(59 - now.getMinutes()).padStart(2, '0');
      const s = String(59 - now.getSeconds()).padStart(2, '0');
      const elH = document.getElementById('ch-hours');
      const elM = document.getElementById('ch-minutes');
      const elS = document.getElementById('ch-seconds');
      if (elH && elM && elS) { elH.textContent = h; elM.textContent = m; elS.textContent = s; }
    }, 1000);
  }

  // ============================================================
  // СИСТЕМА ЗНАЧКІВ ТА ГАЛЕРЕЇ З ОПЛАТОЮ В ГЕМАХ
  // ============================================================
  const availablePins = [
    { id: "pin_juice", name: "Пін Сік (Carreta Juice)", img: "Img/emoji_carreta_juice.png" },
    { id: "pin_classic_small", name: "Маленький Класичний Пін", img: "Img/classic_box_small_pin.png" },
    { id: "pin_classic_mega", name: "Мега Класичний Пін", img: "Img/classic_box_mega_pin.png" }
  ];

  function initPinDropOverlay() {
    if (document.getElementById('pin-drop-overlay')) return;
    document.body.insertAdjacentHTML('beforeend', `
      <div id="pin-drop-overlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 10000; color: #fff; text-align: center;">
        <div style="background: linear-gradient(135deg, #2b1055, #752201); border: 4px solid #ffd700; border-radius: 24px; padding: 30px; max-width: 320px; width: 85%; box-shadow: 0 0 30px #ffd700;">
          <h2 style="color: #ffd700; font-size: 24px; text-shadow: 2px 2px #000;">ВИПАВ ПІН!</h2>
          <img id="dropped-pin-img" src="" style="width: 120px; height: 120px; object-fit: contain; margin: 15px 0;">
          <h3 id="dropped-pin-name" style="font-size: 18px; margin-bottom: 10px;">Назва піна</h3>
          <button style="background: #ffcc00; color: #000; border: none; font-weight: 900; padding: 10px 24px; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 0 #b38f00;" onclick="closePinDrop()">ЗАБРАТИ</button>
        </div>
      </div>
    `);
  }

  function buyPinPack() {
    if (confirm("✨ Придбати Набір значків (Пін Пак) за 19 кристалів?")) {
      if (!spendGems(19)) return;

      const randomIndex = Math.floor(Math.random() * availablePins.length);
      const reward = availablePins[randomIndex];
      let unlockedPins = JSON.parse(localStorage.getItem('game_unlocked_pins')) || [];
      if (!unlockedPins.includes(reward.id)) {
        unlockedPins.push(reward.id);
        localStorage.setItem('game_unlocked_pins', JSON.stringify(unlockedPins));
      }
      const overlay = document.getElementById('pin-drop-overlay');
      if (overlay) {
        document.getElementById('dropped-pin-img').src = reward.img;
        document.getElementById('dropped-pin-name').textContent = reward.name;
        overlay.style.display = 'flex';
      }
      renderPinsGallery();
    }
  }

  function closePinDrop() { document.getElementById('pin-drop-overlay').style.display = 'none'; }

  function initPinsMenuSystem() {
    const charScene = document.getElementById('characters-scene');
    if (!charScene) {
      setTimeout(initPinsMenuSystem, 300);
      return;
    }
    if (document.getElementById('custom-pins-tabs')) return;

    const navBar = document.createElement('div');
    navBar.id = 'custom-pins-tabs';
    navBar.className = 'pins-tab-container';
    navBar.innerHTML = `
      <button id="pins-tab-brawlers" class="pins-tab-btn active" onclick="switchCharSceneTab('brawlers')">Бійці</button>
      <button id="pins-tab-pins" class="pins-tab-btn" onclick="switchCharSceneTab('pins')">Значки</button>
    `;
    const pinsGrid = document.createElement('div');
    pinsGrid.id = 'custom-pins-grid';

    charScene.appendChild(navBar);
    charScene.appendChild(pinsGrid);
    renderPinsGallery();
  }

  function renderPinsGallery() {
    const grid = document.getElementById('custom-pins-grid');
    if (!grid) return;
    grid.innerHTML = '';
    const unlockedPins = JSON.parse(localStorage.getItem('game_unlocked_pins')) || [];
    availablePins.forEach(pin => {
      const isUnlocked = unlockedPins.includes(pin.id);
      const card = document.createElement('div');
      card.className = `pin-card ${isUnlocked ? '' : 'locked'}`;
      card.innerHTML = `
        <img src="${pin.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/744/744922.png';">
        <div class="pin-title">${pin.name}</div>
        ${!isUnlocked ? '<div class="lock-overlay">🔒</div>' : ''}
      `;
      grid.appendChild(card);
    });
  }

  function switchCharSceneTab(target) {
    const charScene = document.getElementById('characters-scene');
    const brawlersBtn = document.getElementById('pins-tab-brawlers');
    const pinsBtn = document.getElementById('pins-tab-pins');
    const pinsGrid = document.getElementById('custom-pins-grid');
    if (!charScene) return;

    if (target === 'pins') {
      brawlersBtn.classList.remove('active');
      pinsBtn.classList.add('active');
      pinsGrid.style.display = 'grid';
      Array.from(charScene.children).forEach(child => {
        if (child.id !== 'custom-pins-tabs' && child.id !== 'custom-pins-grid') {
          if (child.textContent.includes('Назад') || child.id.toLowerCase().includes('back') || child.className.toLowerCase().includes('back')) {
            child.style.display = ''; 
          } else {
            child.style.setProperty('display', 'none', 'important'); 
          }
        }
      });
      renderPinsGallery();
    } else {
      pinsBtn.classList.remove('active');
      brawlersBtn.classList.add('active');
      pinsGrid.style.display = 'none';
      Array.from(charScene.children).forEach(child => {
        if (child.id !== 'custom-pins-tabs' && child.id !== 'custom-pins-grid') { child.style.display = ''; }
      });
    }
  }

  window.buyPinPack = buyPinPack;
  window.closePinDrop = closePinDrop;
  window.switchCharSceneTab = switchCharSceneTab;
</script>
</body>
</html>
