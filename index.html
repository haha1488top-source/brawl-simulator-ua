<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Гра — Ловля монет</title>
<style>
  :root{
    --gold: #ffbf00;
    --green1: #00c853;
    --green2: #008000;
    --common: #b0b0b0;
    --rare: #4a86e8;
    --super-rare: #8e7cc3;
    --epic: #c27ba0;
    --mythic: #9c27b0;
    --legendary: #ff9900;
    --chromatic: #e91e63;
    --trophy: #ffd700;
    --star: #ff4081;
    --new-year: #ff0000;
    --snow: #e0f7fa;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; width:100%; overflow:hidden; font-family:"Segoe UI",Roboto,sans-serif; background:#0a7b0a; touch-action:none;}

  /* --- Loading scene --- */
  #loading-scene{
    position:fixed; inset:0;
    background:url('Img/loading_2020_tara_bazaar.png') center/cover no-repeat;
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  #progress-wrap{
    width:82%; max-width:900px; height:20px; margin-bottom:48px;
    background:rgba(255,255,255,0.25); border-radius:12px; overflow:hidden;
    box-shadow:0 3px 8px rgba(0,0,0,0.35) inset;
  }
  #progress-bar{
    width:0%; height:100%;
    background:linear-gradient(90deg,#7fff7f,#00a000);
    transition:width 0.12s linear;
  }

  /* --- Nickname scene --- */
  #nickname-scene{
    position:fixed; inset:0; display:none;
    background:#f5fbff; align-items:center; justify-content:center; flex-direction:column;
    gap:18px;
  }
  #nickname-scene h2{font-size:22px; color:#0b3a3a;}
  #nickname-input{
    padding:10px 18px; font-size:18px; border-radius:10px; width:78%; max-width:420px;
    border:2px solid #9bd6ff; outline:none; text-align:center; background:#fff;
  }
  #continue-btn{
    padding:10px 36px; font-size:18px; border-radius:10px; cursor:pointer;
    background:linear-gradient(to bottom,#00a8ff,#0078c2); color:#fff; border:none;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }

  /* --- Menu scene --- */
  #menu-scene{
    position:fixed; inset:0; display:none;
    background:url('Img/sandsoftime_lobby.png') center/cover no-repeat;
    overflow:hidden;
  }

  /* Top bar */
  .top-bar{
    position:absolute; top:10px; left:12px; right:12px;
    display:flex; align-items:center; justify-content:space-between;
    z-index: 20;
  }
  .nickname{
    font-size:26px; font-weight:800; color:#fff; text-shadow:2px 2px 4px rgba(0,0,0,0.7);
  }
  .right-part{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .currency{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(0,0,0,0.45);
    padding:6px 10px;
    border-radius:14px;
    color:#fff;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    transition:transform 0.2s;
  }
  .currency:hover{
    transform:scale(1.05);
  }
  .currency img{width:26px; height:26px;}

  /* Trophy style */
  .trophy{
    background:rgba(0,0,0,0.45);
    border:2px solid var(--trophy);
  }

  /* Settings button */
  .settings-btn{
    background:rgba(0,0,0,0.45);
    padding:8px;
    border-radius:50%;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
    border:2px solid var(--gold);
  }

  /* Character */
  #character{
    position:absolute; left:50%; transform:translateX(-50%); top:34%;
    width:220px; height:220px; object-fit:contain;
    z-index: 10;
  }

  /* Rewards */
  #daily-rewards{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:170px; display:flex; gap:12px; align-items:center;
    z-index: 10;
  }
  .reward{
    width:64px; height:64px; border-radius:12px;
    border:3px solid var(--gold); background:rgba(255,215,0,0.10);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 8px rgba(0,0,0,0.25);
    position: relative;
  }
  .reward img{width:56px; height:56px;}
  
  .reward.claimed{
    border:3px solid #666; background:rgba(100,100,100,0.2); filter:grayscale(1);
  }
  
  /* Загальний таймер для всіх скринь */
  #global-timer-container{
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 5px 15px;
    border-radius: 10px;
    border: 2px solid var(--gold);
    display: none;
    z-index: 10;
  }
  
  #global-timer{
    font-size: 14px;
    color: #fff;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    white-space: nowrap;
  }

  /* Bottom controls */
  #bottom-controls{
    position:absolute; left:50%; transform:translateX(-50%); bottom:64px;
    display:flex; align-items:center; gap:22px;
    z-index: 10;
  }
  .play-btn{
    padding:12px 44px; font-size:20px; font-weight:800; color:#fff;
    background:linear-gradient(to bottom,var(--green1),var(--green2));
    border-radius:14px; border:3px solid #ffb347; cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.24);
  }
  .mode-box{
    width:64px; height:64px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    border:3px solid var(--gold); background:rgba(0,0,0,0.16); cursor:pointer;
  }
  .mode-box img{width:44px; height:44px;}

  /* Menu buttons */
  .menu-btn{
    position:absolute; left:20px; padding:8px 22px; font-size:16px; font-weight:700;
    background:linear-gradient(to bottom,#ffcc33,#ff9900);
    border:3px solid #ffea00; border-radius:14px; color:#fff; 
    text-shadow:1px 1px 2px rgba(0,0,0,0.6); box-shadow:0 4px 0 rgba(0,0,0,0.3);
    cursor:pointer;
    z-index: 10;
  }
  .menu-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.3);}
  
  .menu-img-btn{
    position:absolute; left:20px; cursor:pointer; border:none; background:none;
    padding:0; display:flex; align-items:center; justify-content:center;
    z-index: 10;
  }
  
  .menu-img-btn img{
    width:120px; height:auto; border-radius:14px;
    box-shadow:0 4px 0 rgba(0,0,0,0.3); transition:transform 0.1s;
  }
  
  .menu-img-btn:active img{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.3);}
  
  #shop-btn{bottom:420px;}
  #characters-btn{bottom:350px;}
  #brawl-pass-menu-btn{bottom:280px;}
  
  /* Brawl Pass button (тільки кнопка, без сцени) */
  .brawl-pass-btn{
    background:rgba(0,0,0,0.45);
    padding:8px;
    border-radius:50%;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
    border:2px solid var(--gold);
  }
  .brawl-pass-btn img{
    width:24px;
    height:24px;
  }
</style>
</head>
<body>

<!-- Loading scene -->
<div id="loading-scene">
  <div id="progress-wrap">
    <div id="progress-bar"></div>
  </div>
</div>

<!-- Nickname scene -->
<div id="nickname-scene">
  <h2>Привіт! Як тебе звати?</h2>
  <input type="text" id="nickname-input" placeholder="Введи своє ім'я..." />
  <button id="continue-btn">Продовжити</button>
</div>

<!-- Menu scene -->
<div id="menu-scene">
  <div class="top-bar">
    <div class="nickname" id="top-nickname">Гравець</div>
    <div class="right-part">
      <div class="currency">
        <img src="Img/trophy.png" alt="Трофеї" />
        <span id="trophy-count">0</span>
      </div>
      <button class="settings-btn" id="settings-btn">⚙️</button>
      <button class="brawl-pass-btn" id="brawl-pass-menu-btn">
        <img src="Img/brawlpass.png" alt="Brawl Pass">
      </button>
    </div>
  </div>
  
  <img src="Img/tara_default_tara_001.png" id="character" alt="Персонаж" />
  
  <div id="daily-rewards"></div>
  <div id="global-timer-container">
    <div id="global-timer"></div>
  </div>

  <div id="bottom-controls">
    <button class="play-btn" id="play-button">ГРАТИ</button>
    <div class="mode-box" id="mode-box">
      <img src="Img/mode.png" alt="Режими" />
    </div>
  </div>

  <button class="menu-img-btn" id="shop-btn">
    <img src="Img/shop_button.png" alt="Магазин" />
  </button>
  <button class="menu-img-btn" id="characters-btn">
    <img src="Img/characters_button.png" alt="Персонажі" />
  </button>
  <button class="menu-img-btn" id="brawl-pass-menu-btn">
    <img src="Img/brawlpass_button.png" alt="Brawl Pass" />
  </button>
</div>

<script>
  let backgroundMusic = null;
  let musicEnabled = true;

  function initMusic() {
    if (musicEnabled && !backgroundMusic) {
      backgroundMusic = new Audio('Snd/brawzaarmenu01.mp3');
      backgroundMusic.loop = true;
      backgroundMusic.volume = 0.5;
      backgroundMusic.play().catch(e => console.log("Не вдалося відтворити музику:", e));
    }
  }

  // Loading simulation
  window.addEventListener('load', () => {
    const progressBar = document.getElementById('progress-bar');
    let progress = 0;
    const interval = setInterval(() => {
      progress += Math.random() * 30;
      if (progress > 100) progress = 100;
      progressBar.style.width = progress + '%';
      
      if (progress === 100) {
        clearInterval(interval);
        setTimeout(() => {
          document.getElementById('loading-scene').style.display = 'none';
          document.getElementById('nickname-scene').style.display = 'flex';
        }, 500);
      }
    }, 300);
  });

  // Continue button
  document.getElementById('continue-btn').addEventListener('click', () => {
    const name = document.getElementById('nickname-input').value || 'Гравець';
    document.getElementById('top-nickname').textContent = name;
    document.getElementById('nickname-scene').style.display = 'none';
    document.getElementById('menu-scene').style.display = 'block';
    initMusic();
  });

  document.getElementById('music-toggle').addEventListener('change', function() {
    musicEnabled = this.checked;
    if (musicEnabled) {
      if (!backgroundMusic) {
        backgroundMusic = new Audio('Snd/brawzaarmenu01.mp3');
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.5;
      }
      backgroundMusic.play().catch(e => console.log("Не вдалося відтворити музику:", e));
    } else if (backgroundMusic) {
      backgroundMusic.pause();
    }
  });
</script>

</body>
</html>
